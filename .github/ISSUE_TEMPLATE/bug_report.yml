name: Bug 反馈
description: 页面或接口行为不符合预期时使用
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前先确认：已 `npm run dev` 同时起了前端(5173)与后端(3001)，浏览器控制台和终端没有更早的报错。
        安全或密钥相关问题不要写在这里，私下联系维护者。

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么，和预期差在哪
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入「计划」页
        2. 选择 初二 / 物理 / 力学专题
        3. 点击「生成测试」
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、Node 版本、浏览器、是否配置了 DEEPSEEK_API_KEY
      placeholder: Windows 11 / Node 20.11.1 / Chrome 131 / 未配置密钥（本地降级）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错与日志
      description: 浏览器控制台、后端终端输出、相关截图
      render: shell
    validations:
      required: false
