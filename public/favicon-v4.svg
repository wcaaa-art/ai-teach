<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d8d8e" />
      <stop offset="0.55" stop-color="#418b97" />
      <stop offset="1" stop-color="#327a8e" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#brand)" />
  <!-- 四宫格（方案D「大字优先」）：左上 A、右上 i、左下 学、右下 习。
       四字锚点从格心 16/48 内收到 19.1/44.9，字号 23.5 / 20，基线 25.93 / 52.5。 -->
  <text x="19.1" y="25.93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23.5" font-weight="800" fill="#ffffff">A</text>
  <text x="44.9" y="25.93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23.5" font-weight="800" fill="#ffffff">i</text>
  <text x="19.1" y="52.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="800" fill="#ffffff">学</text>
  <text x="44.9" y="52.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="800" fill="#ffffff">习</text>
</svg>
