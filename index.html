<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eff6f7" />
    <!-- 标签页图标：SVG 为主，PNG 与 apple-touch-icon 兜底；v4 文件名用于绕开浏览器 favicon 缓存 -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v4.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v4-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png" />
    <title>Ai学习小伙伴</title>
    <!-- 首帧前同步主题与护眼滤镜：IndexedDB 是异步的，这里只读 store 写下的 localStorage 镜像，
         避免深色/护眼用户先看到一帧原色再跳变。 -->
    <script>
      try {
        if (localStorage.getItem('ai-teach-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
        const eye = JSON.parse(localStorage.getItem('ai-teach-eyecare') || 'null')
        if (eye && eye.enabled) {
          document.documentElement.dataset.eye = 'on'
          document.documentElement.style.setProperty('--eye-strength', String((Number(eye.strength) || 0) / 100))
        }
      } catch (error) {}
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
